<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tallis Living Tenant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap">
<style>
:root{
  /* Layout: sticky top bar, one scrolling column, bottom tabs on phones and a left rail on wide screens. Details open in a sheet: full screen on phones, a right-hand panel on wide screens. */
  --paper:#EEF1EC; --sheet:#F9FBF7; --sunk:#E3E8E3; --ink:#152125; --ink-2:#4A5A5E; --rule:#CAD4CD;
  --accent:#8A4F06; --on-accent:#FFF7EA; --accent-soft:#F4E4CD;
  --lichen:#22684F; --lichen-soft:#D2E7DB;
  --signal:#AC3A28; --signal-soft:#F5DAD4;
  --slate:#40566A; --slate-soft:#DCE3EA;
  --shadow:rgba(21,33,37,.10);
  --f-display:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Atkinson Hyperlegible Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1518; --sheet:#152026; --sunk:#0A1013; --ink:#E4ECE8; --ink-2:#9DB0AC; --rule:#2A3A40;
    --accent:#F0B24C; --on-accent:#1C1304; --accent-soft:#3A2B12;
    --lichen:#7BC8A5; --lichen-soft:#17342A;
    --signal:#FF7C68; --signal-soft:#3F1F1A;
    --slate:#A9BCD0; --slate-soft:#1F2B36;
    --shadow:rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1518; --sheet:#152026; --sunk:#0A1013; --ink:#E4ECE8; --ink-2:#9DB0AC; --rule:#2A3A40;
  --accent:#F0B24C; --on-accent:#1C1304; --accent-soft:#3A2B12;
  --lichen:#7BC8A5; --lichen-soft:#17342A;
  --signal:#FF7C68; --signal-soft:#3F1F1A;
  --slate:#A9BCD0; --slate-soft:#1F2B36;
  --shadow:rgba(0,0,0,.45);
  color-scheme:dark;
}
[hidden]{display:none !important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-underline-offset:.18em}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p,ul,ol,dl,dd{margin:0}
.mono{font-family:var(--f-mono);font-size:.86em;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}

/* ---------- top bar and navigation ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{display:flex;align-items:center;gap:10px;min-height:52px;padding-inline:16px}
.brand{display:grid;line-height:1.15;min-width:0}
.brand b{font-family:var(--f-display);font-weight:850;font-stretch:115%;font-size:1.06rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{margin-left:auto;font-family:var(--f-mono);font-size:.78rem;padding:4px 10px;border:1px solid var(--rule);border-radius:999px;white-space:nowrap;background:var(--sheet);flex:none}
@media (max-width:420px){.clock .wide{display:none}}
.iconbtn{min-width:44px;min-height:44px;border:0;background:transparent;border-radius:10px;cursor:pointer;color:var(--ink-2);font-size:1.15rem}
.iconbtn:hover{color:var(--ink)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--sheet);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{border:0;background:transparent;min-height:58px;display:grid;justify-items:center;align-content:center;gap:2px;font-size:.74rem;color:var(--ink-2);cursor:pointer;position:relative}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:7px;left:calc(50% + 5px);min-width:16px;height:16px;border-radius:8px;background:var(--signal);color:var(--sheet);font-size:.66rem;line-height:16px;padding:0 4px;font-weight:700}
/* Content lays itself out by the width it actually gets (a side panel can take half a tablet screen), not by the screen. */
.main{padding:16px 16px calc(92px + env(safe-area-inset-bottom,0px));max-width:780px;margin-inline:auto;display:grid;gap:16px;container-type:inline-size;container-name:main}
.lockbar{background:var(--signal-soft);color:var(--signal);border-bottom:1px solid var(--signal);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:.92rem}
.lockbar b{color:var(--ink)}
@media (min-width:900px){
  .nav{top:calc(53px + env(safe-area-inset-top,0px));right:auto;width:92px;grid-template-columns:none;grid-auto-rows:76px;border-top:0;border-right:1px solid var(--rule);align-content:start;padding-top:8px}
  .main{margin-left:92px;margin-right:0;max-width:880px;padding:22px 28px 48px}
  .lockbar{margin-left:92px}
  .app.sheet-open .main{margin-right:min(520px,46vw)}
}

/* ---------- sheet (details) ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet-head{display:flex;align-items:center;gap:4px;min-height:52px;padding:0 6px;border-bottom:1px solid var(--rule);background:var(--sheet)}
.sheet-title{font-family:var(--f-body);font-weight:700;font-size:1rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;outline:none}
.sheet-body{overflow:auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;flex:1}
.sheet-body>*{flex-shrink:0}
@media (min-width:900px){
  .sheet{inset:calc(53px + env(safe-area-inset-top,0px)) 0 0 auto;width:min(520px,46vw);border-left:1px solid var(--rule);box-shadow:-14px 0 34px var(--shadow);padding-top:0}
}
/* Portrait tablets: details slide in as a panel over the right side instead of replacing the whole screen. */
@media (min-width:700px) and (max-width:899px){
  .sheet{inset:0 0 0 auto;width:min(560px,80vw);border-left:1px solid var(--rule);box-shadow:-14px 0 34px var(--shadow)}
  .app.sheet-open::before{content:"";position:fixed;inset:0;z-index:35;background:rgba(10,16,18,.38)}
}

/* ---------- building blocks ---------- */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.h1{font-family:var(--f-display);font-weight:850;font-stretch:118%;font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.05}
.h2{font-family:var(--f-display);font-weight:800;font-stretch:110%;font-size:1.28rem;line-height:1.15}
.h3{font-weight:700;font-size:1rem}
.lede{font-size:1.04rem}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;border:1.5px solid transparent;font-weight:700;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:var(--rule);color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink-2)}
.btn.danger{background:transparent;border-color:var(--signal);color:var(--signal)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);text-decoration:underline;text-underline-offset:.2em;cursor:pointer;justify-self:start;align-self:flex-start;text-align:left}
.list{border:1px solid var(--rule);border-radius:14px;background:var(--sheet);overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--rule);background:transparent;text-align:left;width:100%;cursor:pointer;color:var(--ink)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sunk)}
.rmain{display:grid;gap:1px;min-width:0}
.rmain b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmain .mono,.rmain .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8rem}
.row.unread .rmain b::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:8px;vertical-align:middle}
.dot{width:10px;height:10px;border-radius:50%;background:var(--rule)}
.dot.ok{background:var(--lichen)}
.dot.bad{background:var(--signal)}
.dot.warn{background:var(--accent)}
.dot.ro{background:var(--slate)}
.pill{display:inline-block;font-size:.72rem;line-height:1.5;border-radius:999px;padding:0 8px;white-space:nowrap;border:1px solid transparent;font-weight:600}
.pill.ok{background:var(--lichen-soft);color:var(--lichen)}
.pill.bad{background:var(--signal-soft);color:var(--signal)}
.pill.warn{background:var(--accent-soft);color:var(--accent)}
.pill.off{background:var(--sunk);color:var(--ink-2)}
.pill.ro{background:var(--slate-soft);color:var(--slate)}
.kv{display:grid;grid-template-columns:minmax(110px,36%) minmax(0,1fr);gap:7px 12px;font-size:.92rem}
.kv dt{color:var(--ink-2)}
.kv dd{min-width:0;overflow-wrap:anywhere}
.seg{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--sunk);overflow-x:auto}
.seg button{flex:1 0 auto;border:0;background:transparent;border-radius:9px;min-height:38px;padding:0 9px;cursor:pointer;font-size:.88rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);font-weight:700;box-shadow:0 1px 3px var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:4px 12px;border-radius:999px;border:1.5px solid var(--rule);background:var(--sheet);cursor:pointer;font-size:.88rem;text-align:left;color:var(--ink)}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip:disabled{opacity:.5;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule);border-radius:999px;padding:2px 4px 2px 10px;font-size:.84rem;background:var(--paper)}
.tag button{border:0;background:none;cursor:pointer;color:var(--ink-2);min-width:28px;min-height:28px;font-size:1rem}
.field{display:grid;gap:6px}
.field>label,.flabel{font-size:.84rem;color:var(--ink-2)}
input[type=text],input[type=search],select,textarea{border:1.5px solid var(--rule);border-radius:10px;background:var(--paper);padding:9px 10px;min-height:44px;width:100%;box-sizing:border-box}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.check{display:flex;gap:10px;align-items:center;min-height:40px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.err{color:var(--signal);font-size:.88rem}
.note{font-size:.86rem;color:var(--ink-2)}
.warnbox{border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:12px;display:grid;gap:8px;font-size:.9rem}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.divider{border:0;border-top:1px dashed var(--rule);margin:2px 0}

/* ---------- Tallis (world) ---------- */
.sites{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.site{display:grid;gap:4px;align-content:start;text-align:left;border:1.5px solid var(--rule);border-radius:14px;background:var(--sheet);padding:14px;cursor:pointer;color:var(--ink);position:relative;overflow:hidden}
.site::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--lichen)}
.site.bad::before{background:var(--signal)}
.site.warn::before{background:var(--accent)}
.site-k{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.site b{font-size:1.02rem}
.intro{border:2px solid var(--accent)}
/* ---------- the 2D world ---------- */
.world{display:grid;gap:12px}
/* Two columns only when each map gets about 400px; every map then draws at the same scale. */
@container main (min-width:800px){.world{grid-template-columns:1fr 1fr}}
.area{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:10px 10px 8px;display:grid;gap:6px;min-width:0;align-content:start}
.area-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 10px;padding:2px 4px}
.area-h b{font-family:var(--f-display);font-weight:800;font-stretch:110%;font-size:1.02rem;white-space:nowrap}
.area-h span{font-size:.8rem;color:var(--ink-2);text-align:right;flex:1 1 11rem;min-width:0}
.area-h span.bad{color:var(--signal);font-weight:700}
.map{width:100%;height:auto;display:block;max-width:500px;margin-inline:auto}
.map .wall{fill:var(--paper);stroke:var(--rule);stroke-width:1.5}
.map .room{fill:var(--sheet);stroke:var(--rule);stroke-width:1}
.map .room.muted{fill:var(--sunk)}
.map .room.alert,.map .alertbox{stroke:var(--signal);stroke-width:2}
.map .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;fill:var(--ink-2)}
.map .sub{font-family:var(--f-body);font-size:11.5px;fill:var(--ink-2)}
.map .sub.bad{fill:var(--signal);font-weight:700}
.map .cnt{font-family:var(--f-body);font-size:11.5px;fill:var(--ink-2);font-weight:700}
.map .cnt.bad{fill:var(--signal)}
.map .machine{fill:var(--rule)}
.map .hit{fill:transparent}
.map .hitbox{fill:transparent;stroke:transparent}
.map .hitbox.room{fill:var(--sheet);stroke:var(--rule)}
.map .netbox{fill:var(--sheet);stroke:var(--rule)}
.map .wave{fill:none;stroke:var(--ink-2);stroke-width:1.6;stroke-linecap:round}
.map [data-act]{cursor:pointer;outline:none}
.map [data-act]:hover .hitbox,.map [data-act]:focus-visible .hitbox{stroke:var(--accent);stroke-width:2}
.map [data-act]:focus-visible .hit{stroke:var(--accent);stroke-width:2.5}
.map .tok .face,.map .dot .face{fill:var(--sheet);stroke:var(--rule);stroke-width:2}
.map .st-ok .face{fill:var(--lichen-soft);stroke:var(--lichen)}
.map .st-stuck .face{fill:var(--accent-soft);stroke:var(--accent)}
.map .st-blocked .face{fill:var(--signal-soft);stroke:var(--signal)}
.map .st-absent .face{fill:none;stroke:var(--ink-2);stroke-dasharray:3 3}
.map .st-idle .face{fill:var(--sheet);stroke:var(--rule)}
.map .ini{font-family:var(--f-display);font-weight:800;font-size:11px;text-anchor:middle;fill:var(--ink)}
.map .dg{font-family:var(--f-body);font-weight:800;font-size:11px;text-anchor:middle;fill:var(--ink)}
.map .gl circle{fill:var(--ink)}
.map .gl text{font-size:9px;font-weight:800;text-anchor:middle;fill:var(--paper)}
.map .st-blocked .gl circle{fill:var(--signal)}
.map .st-stuck .gl circle{fill:var(--accent)}
.map .gl.new circle{fill:var(--slate)}
.map .ring{fill:none;stroke:var(--signal);stroke-width:2;stroke-dasharray:3 3}
.map .ring2{fill:none;stroke:var(--accent);stroke-width:1.6}
.map .fixring{fill:none;stroke:var(--lichen);stroke-width:2;stroke-dasharray:3 3}
.map .bub rect{fill:var(--accent)}
.map .bub text{font-size:11px;font-weight:800;text-anchor:middle;fill:var(--on-accent)}
.map .bdot{fill:var(--accent);stroke:var(--sheet);stroke-width:1.5}
.map .kiosk{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.2}
.map .kiosk.ok{fill:var(--lichen-soft);stroke:var(--lichen)}
.map .kiosk.part{fill:var(--accent-soft);stroke:var(--accent)}
.map .kiosk.bad{fill:var(--signal-soft);stroke:var(--signal)}
.map .stand{fill:var(--ink-2)}
.map .cab{fill:var(--sunk);stroke:var(--ink-2);stroke-width:1.2}
.map .cabt{font-family:var(--f-display);font-weight:800;font-size:12px;text-anchor:middle;fill:var(--ink)}
.map .qbar{fill:var(--sunk)}
.map .qfill{fill:var(--accent)}
.map .qfill.bad{fill:var(--signal)}
.map .safe{fill:var(--sunk);stroke:var(--ink-2);stroke-width:1.2}
.map .safe.bad{stroke:var(--signal);stroke-width:2}
.map .safed{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.map .dev{fill:var(--sunk);stroke:var(--ink-2);stroke-width:1.2}
.map .dev.warn{fill:var(--accent-soft);stroke:var(--accent)}
.map .empty{fill:none;stroke:var(--rule);stroke-dasharray:2 3}
.map .lock{fill:var(--signal-soft);stroke:var(--signal);stroke-width:1.6}
.map .flag rect{fill:var(--signal)}
.map .flag text{font-family:var(--f-mono);font-size:10px;font-weight:600;text-anchor:middle;fill:var(--sheet)}
@media (prefers-reduced-motion:no-preference){.map .ring2{animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--ink-2);padding:0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;border:2px solid var(--rule);font-style:normal;font-size:.62rem;font-weight:800;color:var(--ink);box-sizing:border-box}
.lg.ok{background:var(--lichen-soft);border-color:var(--lichen)}
.lg.stuck{background:var(--accent-soft);border-color:var(--accent)}
.lg.blocked{background:var(--signal-soft);border-color:var(--signal)}
.lg.absent{border-style:dashed;border-color:var(--ink-2)}
.lg.risk{border-style:dashed;border-color:var(--signal)}
.lg.fixed{border-style:dashed;border-color:var(--lichen)}
.lg.changed{border-color:var(--accent);border-width:3px}
.lg.talk{width:18px;border-radius:6px;background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cal{list-style:none;padding:0;display:grid;gap:0}
.cal li{display:grid;grid-template-columns:7.2rem minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px dashed var(--rule);font-size:.92rem}
.cal li:last-child{border-bottom:0}
.cal .mono{color:var(--ink-2)}

/* ---------- case thread ---------- */
.ticket-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.thread{display:grid;gap:10px}
.msg{display:grid;gap:4px;max-width:90%;padding:10px 12px;border-radius:14px;background:var(--paper);border:1px solid var(--rule);justify-self:start}
.msg.me{justify-self:end;background:var(--accent-soft);border-color:transparent}
.msg .who{font-size:.74rem;color:var(--ink-2)}
.errshot{border:1px solid #D0D4D8;border-radius:10px;padding:14px;background:#FFFFFF;color:#1B1B1B;font-family:"Segoe UI",system-ui,sans-serif;display:grid;gap:6px;font-size:.88rem}
.errshot b{font-size:1.02rem;font-weight:600}
.errshot .fine{font-size:.74rem;color:#505050;font-family:ui-monospace,Consolas,monospace}
.req{list-style:none;padding:0;display:grid;gap:8px}
.req li{display:grid;grid-template-columns:1.8rem minmax(0,1fr);gap:8px;align-items:start;font-size:.94rem}
.req .num{font-family:var(--f-display);font-weight:800;font-size:1.1rem;color:var(--accent);text-align:center}
.req .mark{font-weight:800;text-align:center}
.req .mark.ok{color:var(--lichen)}
.req .mark.bad{color:var(--signal)}

/* ---------- policies and details ---------- */
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:start}
.prow:last-child{border-bottom:0}

/* ----- key registration sessions, run by Tomáš at shift start ----- */
const keysAtPlant = () => W.thu.orders.filter(o => o.delivered).reduce((n, o) => n + o.qty, 0) - W.thu.keysUsed;
const TAP_WHY = { none: 'had no Temporary Access Pass', notyet: 'had a pass that wasn’t valid yet', expired: 'had a pass that had already expired', used: 'had a one-time pass that was already used', disabled: 'had a pass, but Temporary Access Pass sign-in isn’t enabled for them' };
function runSession(s, add) {
  const cfg = W.cfg;
  const g = grp(s.gid);
  const members = g ? g.members.filter(onFloor) : [];
  const told = W.thu.comms.floor && W.thu.comms.floor < at(s.d, 0, 0, 0);
  const res = { reg: [], absent: [], late: [], already: [], noKey: [], disabled: [], tap: {} };
  members.forEach(uid => {
    if (absent(uid, s.d)) { res.absent.push(uid); return; }
    if (!told && hash01(uid + ':late:' + s.d) < 0.22) { res.late.push(uid); return; }
    if (regOf(uid).indexOf('passkey') >= 0) { res.already.push(uid); return; }
    if (keysAtPlant() <= 0) { res.noKey.push(uid); return; }
    if (!methodOn('passkey', uid, cfg) || !cfg.methods.passkey.selfService) { res.disabled.push(uid); return; }
    const att = { user: uid, t: s.t, atKiosk: true };
    if (!usableAt(uid, att, cfg).length) { const st = tapState(uid, s.t, cfg); (res.tap[st] = res.tap[st] || []).push(uid); return; }
    W.thu.reg[uid] = regOf(uid).concat(['passkey']);
    W.thu.keysIssued[uid] = true; W.thu.keysUsed++;
    const tp = W.thu.taps[uid]; if (tp && tp.oneTime && tapState(uid, s.t, cfg) === 'valid') tp.used = true;
    res.reg.push(uid);
  });
  s.status = 'done';
  s.res = { reg: res.reg.length, of: members.length };
  const lines = [];
  lines.push(res.reg.length + ' of ' + members.length + ' registered a security key.');
  if (res.absent.length) lines.push(nameList(res.absent) + (res.absent.length > 1 ? ' were' : ' was') + ' off today.');
  if (res.late.length) lines.push(nameList(res.late) + ' didn’t know about it and came late.');
  if (res.noKey.length) lines.push(res.noKey.length === members.length ? 'The keys aren’t here yet.' : 'We ran out of keys for ' + nameList(res.noKey) + '.');
  if (res.disabled.length) lines.push('The sign-in page said security keys aren’t enabled for ' + (res.disabled.length === members.length ? 'any of us' : nameList(res.disabled)) + '.');
  Object.keys(res.tap).forEach(k => lines.push(nameList(res.tap[k]) + ' ' + TAP_WHY[k] + ', so they couldn’t sign in to register.'));
  msg('chg0420', 'u-tomas', lines.join(' '), s.t + 1500);
  add(res.reg.length === members.length ? 'ok' : res.reg.length ? 'info' : 'bad', 'Key registration with ' + (g ? g.name : 'the floor'), lines.join(' '), { thread: 'chg0420' });
}

/* ================= authentication methods policy ================= */
const LIFETIMES = [[10, '10 minutes'], [60, '1 hour'], [240, '4 hours'], [480, '8 hours'], [1440, '1 day'], [4320, '3 days'], [10080, '7 days'], [43200, '30 days']];
const lifeLabel = m => { const x = LIFETIMES.find(l => l[0] === m); return x ? x[1] : m + ' minutes'; };
function methodDraft(m) {
  const p = W.cfg.methods[m];
  return { m, state: p.state, incAll: p.include === 'all', inc: p.include === 'all' ? [] : (p.include || []).slice(), exc: (p.exclude || []).slice(), selfService: p.selfService !== false, minMin: p.minMin, maxMin: p.maxMin, defMin: p.defMin, oneTime: !!p.oneTime };
}
SHEETS.method = s => {
  const m = s.id, p = W.cfg.methods[m];
  if (s.edit && ui.draft && ui.draft.m === m) {
    const d = ui.draft;
    const gt = (field, sel) => allGroups().map(g => `<button type="button" class="optbtn" data-act="md-tog" data-v="${field}:${g.id}" aria-pressed="${sel.indexOf(g.id) >= 0}"><span class="box">${sel.indexOf(g.id) >= 0 ? '✓' : ''}</span><span>${esc(g.name)}</span></button>`).join('');
    const sel = (id, field, val) => `<select id="${id}" data-bind="md:${field}">${LIFETIMES.map(l => `<option value="${l[0]}"${l[0] === val ? ' selected' : ''}>${l[1]}</option>`).join('')}</select>`;
    return { title: 'Edit ' + METHODS[m], body: `
      <div class="field"><span class="flabel">Enable</span><div class="seg" role="group">${[['on', 'Enabled'], ['off', 'Disabled']].map(x => `<button type="button" data-act="md-state" data-v="${x[0]}" aria-pressed="${d.state === x[0]}">${x[1]}</button>`).join('')}</div></div>
      <div class="field"><span class="flabel">Include</span>${radio('md-incall', d.incAll ? 'all' : 'sel', [['all', 'All users'], ['sel', 'Select groups']])}${d.incAll ? '' : `<div class="optlist">${gt('inc', d.inc)}</div>`}</div>
      <div class="field"><span class="flabel">Exclude</span><div class="optlist">${gt('exc', d.exc)}</div></div>
      ${m === 'passkey' ? `<label class="check"><input type="checkbox" id="mdSelf" data-bind="md:self"${d.selfService ? ' checked' : ''}> Allow self-service set up</label>` : ''}
      ${m === 'tap' ? `<div class="split"><div class="field"><label for="mdMin">Minimum lifetime</label>${sel('mdMin', 'minMin', d.minMin)}</div><div class="field"><label for="mdMax">Maximum lifetime</label>${sel('mdMax', 'maxMin', d.maxMin)}</div><div class="field"><label for="mdDef">Default lifetime</label>${sel('mdDef', 'defMin', d.defMin)}</div></div><label class="check"><input type="checkbox" id="mdOne" data-bind="md:one"${d.oneTime ? ' checked' : ''}> One-time use for every pass</label>` : ''}
      ${ui.rangeMsg ? `<p class="err">${esc(ui.rangeMsg)}</p>` : ''}
      <div class="cta"><button type="button" class="btn primary" data-act="md-save">Save</button><button type="button" class="btn ghost" data-act="md-cancel">Cancel</button></div>` };
  }
  const users = USERS.filter(u => u.enabled && methodOn(m, u.id, W.cfg)).length;
  const extra = m === 'tap' ? [['Minimum lifetime', lifeLabel(p.minMin)], ['Maximum lifetime', lifeLabel(p.maxMin)], ['Default lifetime', lifeLabel(p.defMin)], ['One-time use', p.oneTime ? 'Yes' : 'No']] : m === 'passkey' ? [['Allow self-service set up', p.selfService !== false ? 'Yes' : 'No'], ['Passkey types', 'Device-bound (security keys and Microsoft Authenticator)']] : [];
  const mt = m === 'passkey' ? tm('passkey', METHODS[m]) : m === 'tap' ? tm('tap', METHODS[m]) : esc(METHODS[m]);
  return { title: METHODS[m], body: `<div class="ticket-head"><span class="pill ${p.state === 'on' ? 'ok' : 'off'}">${p.state === 'on' ? 'Enabled' : 'Disabled'}</span></div><p class="note">${mt}, one entry in the ${tm('authmethod', 'authentication methods policy')}.</p>` + kv([['Target', methodTarget(p)], ['People it covers', String(users)]].concat(extra)) +
    `<p class="note">${esc(({ passkey: 'People must complete MFA in the last five minutes before they can register a passkey. A Temporary Access Pass counts.', authenticator: 'Push notifications and passkeys in the app. It needs the person’s phone at hand.', sms: 'One-time codes by text message. It needs the person’s phone at hand.', tap: 'A time-limited passcode that satisfies MFA, mostly for onboarding and recovery. Only people included here can sign in with a pass.' })[m])}</p>` +
    (isThu() && !W.thu.done ? `<div class="cta"><button type="button" class="btn ghost" data-act="md-edit"${adminBlocked() ? ' disabled' : ''}>Edit</button></div>` : '') };
};

/* ================= Thursday forms ================= */
SHEETS.tap = s => {
  const parts = String(s.id || '').split(':');

  const pol = W.cfg.methods.tap;
  if (f.target === undefined) f.target = parts[0] === 'user' ? 'u:' + parts[1] : 'g:g-floor';

  const lifeOpts = LIFETIMES.filter(l => l[0] >= pol.minMin && l[0] <= pol.maxMin);
  if (!lifeOpts.find(l => l[0] === +f.life) && lifeOpts.length) f.life = lifeOpts[0][0];
  const days = []; for (let d = today() + 1; d <= today() + 7; d++) days.push(d);
  return { title: 'Create Temporary Access Passes', body: `

    <div class="field"><label for="tapStart">Activation</label><select id="tapStart" data-bind="tap:start"><option value="now"${f.start === 'now' ? ' selected' : ''}>Now (${esc(whenText(W.now))})</option>${days.map(d => `<option value="${d}"${String(f.start) === String(d) ? ' selected' : ''}>${esc(dayShort(d))}, 05:45</option>`).join('')}</select></div>
    <div class="field"><label for="tapLife">Lifetime</label><select id="tapLife" data-bind="tap:life">${lifeOpts.map(l => `<option value="${l[0]}"${+f.life === l[0] ? ' selected' : ''}>${l[1]}</option>`).join('')}</select><span class="note">The TAP policy allows ${esc(lifeLabel(pol.minMin))} to ${esc(lifeLabel(pol.maxMin))}.</span></div>
    <label class="check"><input type="checkbox" id="tapOne" data-bind="tap:one"${f.oneTime || pol.oneTime ? ' checked' : ''}${pol.oneTime ? ' disabled' : ''}> One-time use</label>
    <p class="note">For the floor, Tomáš prints the passes and hands them out at the kiosks.</p>
    <div class="cta"><button type="button" class="btn primary" data-act="tap-create"${adminBlocked() ? ' disabled' : ''}>Create</button><button type="button" class="btn ghost" data-act="back">Cancel</button></div>` };
};

function threadMsgs(th) { return `<div class="thread">${th.msgs.map(m => msgHtml(m)).join('')}</div>`; }

  }

      threadMsgs(th) +
      (done ? `<div class="cta"><button type="button" class="btn primary" data-act="open" data-v="check">See the results</button></div>` :
      `<div class="field"><span class="flabel">Work on it</span><div class="chips">${chip('open-order', 'Order security keys', locked)}${chip('open-session', 'Schedule a key registration session')}${chip('open-announce', 'Announce the change')}${chip('ask-petra', 'Ask Petra about phones on the floor', asked.petra)}${chip('ask-tomas', 'Ask Tomáš for a pilot line', asked.tomas)}${chip('ask-marcus', 'Ask Marcus to add a passkey')}${chip('ask-aisha', 'Ask Aisha to review', W.thu.aishaDay === today())}</div></div>`) +
      (sessions.length || orders.length ? `<div class="card"><p class="eyebrow">Scheduled</p><ul class="cal">${orders.concat(sessions).join('')}</ul></div>` : '') +

/* A term is a tappable word wherever it matters. The underline fades once you can recognize, explain and use it. */
function tm(id, label) {
  const T0 = TERMS[id];

}
const lvRow = id => `<div class="lvrow" role="img" aria-label="${esc(LEVELS.filter(l => levelOn(id, l[0])).map(l => l[1]).join(', ') || 'Not met yet')}">${LEVELS.map(l => `<span class="lv${levelOn(id, l[0]) ? ' on' : ''}"><i></i>${l[1]}</span>`).join('')}</div>`;
const lvDots = id => `<span class="lvdots" aria-label="${masteryOf(id)} of 5">${LEVELS.map(l => `<i class="${levelOn(id, l[0]) ? 'on' : ''}"></i>`).join('')}</span>`;
function openTerm(id, from) {
  if (!TERMS[id]) return;
  const fresh = meet(id, from || 'You looked it up while working.');
  if (!fresh && K.terms[id]) { K.terms[id].lookups = (K.terms[id].lookups || 0) + 1; K.terms[id].lastLookup = Date.now(); }
  else if (K.terms[id]) K.terms[id].lookups = 1;
  saveK();
  record('term_open', { id });
  ui.form = {};
  /* Flipping between look-alikes is a sign you want them side by side. */
  const prev = ui.lastTerm;
  const vs = prev && prev.id !== id && (TERMS[id].pairs || []).indexOf(prev.id) >= 0 && Date.now() - prev.at < 180000 ? prev.id : null;
  ui.lastTerm = { id, at: Date.now() };

  render(); focusSheet();
}
function vsBlock(a, b) {

function contrastBlock(id) {

let helpGateTimer = 0;
function helpChip(set, kind, label, primary) {
  const left = gateLeft(set, kind);

  if (left > 0) return `<button type="button" class="chip" disabled data-gate="${kind}">${esc(label)} · in ${Math.ceil(left / 1000)} s</button>`;

function helpBody(set) {

  const g = m ? (h.given[m.id] || {}) : {};
  const changed = S.acts().some(a => /^(save_|create_|delete_)/.test(a.type));
  const asks = h.log.filter(x => x.from === 'you').length;
  const anyStep = Object.keys(h.given).some(k => h.given[k].step) || asks >= 4;
  const open = helpOpen(set);

    if (!g.concept && m.concept) chips.push(helpChip(set, 'concept', 'What does that mean?'));
    if (!g.step && (g.nudge || g.where || g.concept)) chips.push(helpChip(set, 'step', 'What do I do next?'));
  }
  if (open && changed) chips.push(helpChip(set, 'check', 'I changed something. Did it work?'));
  const showAnswer = open && m && anyStep && !h.log.some(x => x.answer);
  const answerLeft = showAnswer ? gateLeft(set, 'answer') : 0;
  const answer = !showAnswer ? '' : answerLeft > 0 ? `<p class="note">The whole answer opens once you’ve tried that, or in ${Math.ceil(answerLeft / 1000)} s.</p>` : `<button type="button" class="linkbtn" data-act="help-ask" data-v="${set === 'mon' ? 'answer' : set + ':answer'}">Just tell me the whole answer</button>`;
  const gated = chips.some(c => /data-gate=/.test(c)) || answerLeft > 0;
  clearTimeout(helpGateTimer);
  if (gated) {
    const wait = Math.min(...['where', 'concept', 'step', 'answer'].map(k => gateLeft(set, k)).filter(x => x > 0));
    helpGateTimer = setTimeout(() => { const t = top(); if (t && t.type === 'help') renderSheet(); }, wait + 60);

}

    const why = K.revisit[E.term] && K.revisit[E.term].status === 'due' ? 'It came back because you leaned on it this week: ' : '';
    body += `<div><p class="eyebrow">The echo · ${esc(E.where)}</p><h2 class="h2">One question, answered by your tenant</h2><p class="lede">${esc(E.q)}</p>${phase() !== 'tallis' ? `<p class="note">Exam wording: ${esc(E.exam)}</p>` : ''}<p class="note">${why}${tm(E.term)}</p></div>
      <div class="optlist">${E.opts.map(o => `<button type="button" class="optbtn" data-act="c2-echo-pick" data-v="${id}:${o[0]}" aria-pressed="${!!ec && ec.pick === o[0]}"${ec && ec.checked ? ' disabled' : ''}><span class="box">${ec && ec.pick === o[0] ? '✓' : ''}</span><span>${esc(o[1])}</span></button>`).join('')}</div>`;
    if (ec && ec.pick && !ec.checked) body += `<div class="cta"><button type="button" class="btn primary" data-act="c2-echo-check">Check with the tenant</button></div>`;
    if (ec && ec.checked) { const r = echoEvalC2(id); const lab = (E.opts.find(o => o[0] === ec.actual) || ['', ec.actual])[1]; body += `<div class="card"><p><b>${ec.actual === ec.pick ? 'You called it.' : 'Not what you predicted.'}</b> Your tenant says: ${esc(lab)}.</p><p>${esc(echoWhyC2(id, ec.actual, r.e))}</p></div>`; }
  } else {
    const fb = C.fb;
    const pick = (key, opts) => `<div class="chips" role="group">${opts.map(o => `<button type="button" class="chip" data-act="c2-fb" data-v="${key}:${o[0]}" aria-pressed="${fb[key] === o[0]}">${o[1]}</button>`).join('')}</div>`;
    body += `<div><h2 class="h2">Your take</h2><p class="muted small">This week tested the Day Ahead, so these answers decide what comes next.</p></div>
      <div class="field"><span class="flabel">Did calling the night make you want to see what happened?</span>${pick('curious', [['yes', 'Yes'], ['sortof', 'Sort of'], ['no', 'No']])}</div>
      <div class="field"><span class="flabel">Did the calls feel like a quiz?</span>${pick('quiz', [['no', 'No'], ['bit', 'A little'], ['yes', 'Yes']])}</div>
      <div class="field"><span class="flabel">Did the strip help you see problems coming?</span>${pick('strip', [['yes', 'Yes'], ['sortof', 'Sort of'], ['no', 'No']])}</div>
      <div class="field"><span class="flabel">Was it fun?</span>${pick('fun', [['yes', 'Yes'], ['sortof', 'Sort of'], ['no', 'No']])}</div>
      <div class="field"><span class="flabel">Did you learn something about apps and identities?</span>${pick('learned', [['yes', 'Yes'], ['alittle', 'A little'], ['no', 'No']])}</div>
      <div class="field"><label for="c2fbn">Anything that felt off, boring, too easy or too hard? (optional)</label><textarea id="c2fbn" data-bind="c2fbnote">${esc(fb.note || '')}</textarea></div>
      <div class="cta"><button type="button" class="btn primary" data-act="c2-fb-save">${C.fbSaved ? 'Save again' : 'Save my answers'}</button></div>
      ${C.fbSaved ? `<p class="note">Saved${db ? ' to this page. Tell Claude in chat when you’re done, and it can read your week.' : ' in this browser.'}</p>` : ''}`;
  }
  body += `<div class="cta">${k > 0 ? `<button type="button" class="btn ghost" data-act="c2-dstep" data-v="${k - 1}">Back</button>` : ''}${k < 3 ? `<button type="button" class="btn primary" data-act="c2-dstep" data-v="${k + 1}">Next</button>` : ''}</div>`;
  return { title: 'The week of the new app', body };
};

  record('signin_tab', { id: sid, tab: 'ca', kind: 'floorMon' });
  ok('acting on the pointer without a lookup counts as recognizing the words', levelOn('ca', 'recognize') && K.help[1].resolved && !W.help.expect);
  ok('the 53003 rule is proven in the Field Guide', K.rules.some(r => r.id === 'r-53003') && levelOn('authz', 'met'));
  ok('help skips ahead once you are further along', (() => { W.actions.push({ type: 'open_ticket', id: 'CHG-0412', st: W.now, rt: 0 }); return nextMilestone().id === 'fix'; })());
  W.actions.pop();
  record('save_policy', { summary: 'Changed CA07: state → Off.' });
  ok('switching CA07 off is noted as a named-location misconception', !!K.mis['policy-is-problem'] && K.revisit.namedloc && K.revisit.namedloc.status === 'due');
  ok('the blunt fix gets a pointed check, not the answer', (() => { W.cfg.policies.find(p => p.id === 'CA07').state = 'off'; const t = changeCheck(); return /places that aren’t the plant/.test(t); })());
  ok('the echo brings named locations back at Kovo', chooseEcho() === 'kovo');
  W.cfg.policies.find(p => p.id === 'CA07').state = 'on';
  W.cfg.locations.find(l => l.id === 'loc-brno').ranges = ['203.0.113.80/28'];
  W.cfg.locations = W.cfg.locations.filter(l => l.id !== 'loc-brno-new');
  helpProgress();
  ok('fixing it yourself counts as using it', levelOn('namedloc', 'use') && levelOn('ca', 'use'));
  const ek = echoEval('kovo');
  ok('with the typo gone, Radek at Kovo is asked for MFA', ek.k === 'mfa', ek.k);
  echoChecked('kovo', 'mfa', ek.k);
  ok('calling the echo right marks it handled alone', K.revisit.namedloc.status === 'independent');
  echoChecked('plant', 'blocked', echoEval('plant').k);
  ok('a wrong echo is recorded as a misconception and stays due', !!K.mis['echo-plant'] && K.revisit.authz.status === 'due');
  contrastAnswer('authn|authz', 'authz');
  ok('telling authentication from authorization counts for both', levelOn('authn', 'distinguish') && levelOn('authz', 'distinguish'));
  contrastAnswer('namedloc|trustedloc', 'yes');
  explainRate('namedloc', 'same', 'A list of IP ranges a policy can trust or exclude.');
  ok('explaining it in your words counts once you say it matches', levelOn('namedloc', 'explain') && masteryOf('namedloc') >= 4);
  ok('the underline fades once you know a term', tm('namedloc').indexOf('<button') < 0 && tm('whatif').indexOf('<button') === 0);
  ok('the exam bridge follows the date', (() => { const d = n => new Date(Date.now() + n * 864e5).toISOString().slice(0, 10); K.exam.date = d(100); const a = phase(); K.exam.date = d(30); const b = phase(); K.exam.date = d(10); const c = phase(); K.exam.date = ''; return a === 'tallis' && b === 'bridge' && c === 'exam' && phase() === 'tallis'; })());
  ok('the term card reorders for the exam', (() => { K.exam.lens = 'tallis'; const t = SHEETS.term({ id: 'namedloc' }).body; K.exam.lens = 'exam'; const x = SHEETS.term({ id: 'namedloc' }).body; K.exam.lens = 'auto'; return t.indexOf('In plain English') < t.indexOf('Microsoft’s wording') && x.indexOf('On the SC-300') < x.indexOf('In plain English') && /Brno plant/.test(t); })());
  ok('the Field Guide only lists what you met', (() => { const g = SHEETS.guide().body; return /Terms you’ve met/.test(g) && /Named location/.test(g) && !/Temporary Access Pass/.test(g); })());
  ok('the help sheet offers a nudge before the answer', (() => { W = newWorld(); refreshGroups(); W.status = 'open'; const b = SHEETS.help().body; return /I’m stuck/.test(b) && !/whole answer/.test(b); })());
  /* help can't be clicked through in seconds */
  W = newWorld(); refreshGroups(); K = newK();
  helpAsk('nudge');
  ok('right after a nudge, a deeper hint waits', helpAskSet('mon', 'where') === false && gateLeft('mon', 'where') > 0 && /in \d+ s/.test(SHEETS.help().body));
  record('ask', { q: 'screen' });
  ok('doing something opens the next hint at once', gateLeft('mon', 'where') === 0 && helpAskSet('mon', 'where') === true);
  ok('the whole answer waits too', gateLeft('mon', 'answer') > 0);
  /* Thursday: one Aisha, three problems */
  W = JSON.parse(wed); refreshGroups(); K = newK();
  ok('Thursday offers help on the floor, CA01 and the rollout', thuHelpSets().join() === 'brno,legacy,rollout', thuHelpSets().join());
  ok('Thursday help sheet asks what you’re stuck on', /CHG-0420 · MFA for everyone/.test(SHEETS.help({ type: 'help' }).body) && /INC-2217/.test(SHEETS.help({ type: 'help' }).body));
  ok('rollout help starts with what the floor can use', nextMs('rollout').id === 'r-constraint' && helpAskSet('rollout', 'nudge') && /kiosk/.test(hs('rollout').log[1].text));
  W.thu.asked.petra = true;
  ok('rollout help moves on once you know the phone rule', nextMs('rollout').id === 'r-path');
  ok('floor help starts at this morning’s failure', nextMs('brno').id === 'b-see');
  ok('CA01 help checks the real gap', /CA01/.test(legacyCheck()) && !legacyStatus(W.cfg).ok);
  ok('rollout “did it work?” is Aisha’s review', helpAskSet('rollout', 'check') && hs('rollout').log[hs('rollout').log.length - 1].text === aishaReview());
  ok('Thursday help is remembered with its thread', K.help.length === 2 && K.help.every(h => h.set === 'rollout' && /CHG-0420/.test(h.case)));
  /* one Field Guide across devices */
  const KA = newK(), KB = newK();
  KA.terms.namedloc = { met: { at: 10, when: 'a' }, lookups: 1, ev: { use: { at: 20, note: 'u' } }, confused: [] };
  KB.terms.namedloc = { met: { at: 5, when: 'b' }, lookups: 3, ev: { explain: { at: 30, note: 'e' } }, confused: ['pair-namedloc|trustedloc'] };
  KB.terms.tap = { met: { at: 7, when: 'b' }, lookups: 0, ev: {}, confused: [] };
  KA.help = [{ at: 1, kind: 'nudge', m: 'ca' }]; KB.help = [{ at: 1, kind: 'nudge', m: 'ca' }, { at: 2, kind: 'where', m: 'ca' }];
  KA.revisit.ca = { status: 'due', reasons: ['help:where'], tries: [], updated: 100 }; KB.revisit.ca = { status: 'independent', reasons: ['help:step'], tries: [{ at: 50, ok: true }], updated: 200 };
  KB.exam = { date: '2027-01-01', lens: 'exam' };
  KB.contrast = { 'authn|authz': { pick: 'authz', ok: true, at: 9 } };
  const KM = mergeK(KA, KB);
  ok('merging two devices keeps everything from both', KM.terms.namedloc.met.at === 5 && KM.terms.namedloc.lookups === 3 && !!KM.terms.namedloc.ev.use && !!KM.terms.namedloc.ev.explain && KM.terms.namedloc.confused.length === 1 && !!KM.terms.tap && KM.help.length === 2 && KM.contrast['authn|authz'].ok);
  ok('the newer revisit status wins, reasons combine', KM.revisit.ca.status === 'independent' && KM.revisit.ca.reasons.length === 2 && KM.revisit.ca.tries.length === 1);
  ok('an exam date set on one device carries over', KM.exam.date === '2027-01-01' && KM.exam.lens === 'exam');
  ok('merging is idempotent', JSON.stringify(mergeK(KM, KM).terms) === JSON.stringify(KM.terms) && mergeK(KM, KM).help.length === 2);
  try { selfTestC2(ok, wed); } catch (err) { ok('Ch2 self-test threw', false, String((err && err.stack) || err).slice(0, 400)); }
  testing = false;
  K = savedK;
  W = saved; refreshGroups();
  return out;
}

/* ================= boot (keeps your place if the page updates while open) ================= */
function start(hot) {
  let had = true;
  try { slot = localStorage.getItem(SLOT_KEY) === 'practice' ? 'practice' : 'main'; } catch (err) { slot = 'main'; }
  K = loadK();
  W = load();
  if (!W && slot === 'practice') { W = newWorld(); W.practice = true; had = false; }
  if (!W) { had = false; W = newWorld(); }
  refreshGroups();
  const h = hot || {};
  if (h.ui && typeof h.ui === 'object') ['tab', 'logs', 'access', 'people', 'apps', 'dstep', 'cstep'].forEach(k => { if (h.ui[k] !== undefined) ui[k] = h.ui[k]; });
  if (h.ui && Array.isArray(h.ui.sheets)) ui.sheets = h.ui.sheets.filter(s => s && SHEETS[s.type] && !s.edit && s.id !== 'new' && ['night', 'secretnew', 'assign', 'roleadd', 'signoff'].indexOf(s.type) < 0).map(s => ({ type: s.type, id: s.id, tab: s.tab }));
  if (['tallis', 'work', 'logs', 'access', 'people', 'apps'].indexOf(ui.tab) < 0 || (ui.tab === 'apps' && !isC2())) ui.tab = 'tallis';
  if (location.hash === '#selftest') {
    const res = selfTest();
    $('main').innerHTML = `<div class="card"><h1 class="h2">Self-test</h1><pre class="selftest" id="selftest">${esc(res.join('\n'))}\n\n${res.filter(x => x.indexOf('FAIL') === 0).length} failed of ${res.length}</pre></div>`;
    return;
  }
  save();
  render();
  connectDb().then(async d => {
    if (d) { await connectUser(); if (await syncKOnLoad()) render(); }
    if (!d || had || slot !== 'main') return;
    try {
      const snap = await d.collection('runs').get();
      const runs = snap.docs.filter(x => x.exists && /^[^-]+$/.test(x.id)).map(x => ({ id: x.id, data: x.data() })).filter(r => r.data && r.data.v === 'ch1-1' && !r.data.practice && r.data.outcome && r.data.finalConfig).sort((a, b) => (b.data.updatedAt || 0) - (a.data.updatedAt || 0));
      if (runs.length && W.ch === 'mon' && !W.seen.intro) { ui.restore = runs[0]; render(); }
    } catch (err) { /* no saved runs */ }
  });
}
try {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ ui: { tab: ui.tab, logs: ui.logs, access: ui.access, people: ui.people, apps: ui.apps, dstep: ui.dstep, cstep: ui.cstep, sheets: ui.sheets.map(s => ({ type: s.type, id: s.id, tab: s.tab, edit: s.edit })) } }));
} catch (err) {}
const hotApi = window.claude && window.claude.hot;
if (hotApi && typeof hotApi.ready === 'function') hotApi.ready(start);
else start((hotApi && hotApi.data) || {});
})();
